name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clip_demo:
        description: Build only the John 3:16 clipping demo APK
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.clip_demo || false }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.clip_demo }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: |
          bash scripts/test-next-version.sh
          python3 scripts/test-prepare-macula-books.py
          node --test web/core.test.mjs web/acoustic.test.mjs
          ./gradlew :core:jvmTest :app:testDebugUnitTest :app:assembleDebug
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  launch:
    if: ${{ !inputs.clip_demo }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare offline Greek TTS engine
        if: matrix.api-level == 35
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-1.52.0-signed.apk \
            -o "$RUNNER_TEMP/espeak.apk"
          echo "741b46abf84d843f9b0cce80136f60ffee9b9fe591601b9701aa2a9ff99c9ddf  $RUNNER_TEMP/espeak.apk" | sha256sum --check
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-android-device-tests.sh '${{ matrix.api-level == 35 }}'
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: launch-test-reports-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore

  clip-demo:
    if: ${{ inputs.clip_demo }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew -PclipDemo :app:assembleDebug
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: john-3-16-clip-demo
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
