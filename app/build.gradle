apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def appVersionName = (project.findProperty('appVersion') ?: '1.0.0').toString()
def appVersionCode = (project.findProperty('appVersionCode') ?: '10000').toString().toInteger()
def maculaAssets = layout.buildDirectory.dir('generated/maculaAudioAssets')
def clipDemo = project.hasProperty('clipDemo')

tasks.register('generateMaculaAssets', Exec) {
    inputs.files(rootProject.file('scripts/generate-macula-assets.sh'),
        rootProject.file('scripts/prepare-macula-books.py'),
        rootProject.file('scripts/generate-recording-plan.mjs'))
    outputs.dir(maculaAssets)
    commandLine 'bash', rootProject.file('scripts/generate-macula-assets.sh'),
        maculaAssets.get().asFile.absolutePath
}

android {
    namespace 'io.github.danzuep.bibleaudioproducer'
    compileSdk 35

    defaultConfig {
        applicationId clipDemo ? 'io.github.danzuep.bibleaudioproducer.clipdemo' :
            'io.github.danzuep.bibleaudioproducer'
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [launcherActivity: clipDemo ?
            'io.github.danzuep.bibleaudioproducer.ui.ClipDemoActivity' :
            'io.github.danzuep.bibleaudioproducer.ui.WorkbenchActivity']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        if (keystorePropertiesFile.isFile()) {
            def properties = new Properties()
            keystorePropertiesFile.withInputStream { properties.load(it) }
            release {
                keyAlias properties['keyAlias']
                keyPassword properties['keyPassword']
                storeFile rootProject.file(properties['storeFile'])
                storePassword properties['storePassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '.debug'
        }
        release {
            if (keystorePropertiesFile.isFile()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
        }
    }
    splits {
        abi {
            enable !clipDemo
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: 'universal'
            def abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]
            output.versionCodeOverride = defaultConfig.versionCode * 10 + (abiCodes[abi] ?: 0)
            def versionPart = variant.name == 'release' ? variant.versionName : variant.name
            def signingSuffix = variant.name == 'release' && !keystorePropertiesFile.isFile() ?
                '-temporary-key' : ''
            output.outputFileName = "BibleAudioProducer-${versionPart}-${abi}${signingSuffix}.apk"
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    if (clipDemo) {
        sourceSets.main.java.srcDir('src/clipDemo/java')
    } else {
        sourceSets.main.assets.srcDir(maculaAssets)
    }
}

if (!clipDemo) {
    tasks.named('preBuild').configure { dependsOn tasks.named('generateMaculaAssets') }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.code.gson:gson:2.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
